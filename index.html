<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro-Radio</title>
    
    <!-- ========== PRELOAD & PREFETCH ========== -->
    <link rel="preconnect" href="https://radio.garden">
    <link rel="preconnect" href="https://ice1.somafm.com">
    <link rel="preconnect" href="https://icecast-vgtrk.cdnvideo.ru">
    <link rel="preconnect" href="https://ep128.hostingradio.ru">
    <link rel="preconnect" href="https://nashe1.hostingradio.ru">
    
    <!-- ========== FAVICON ========== -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000000%22/><text x=%2250%22 y=%2270%22 font-size=%2265%22 text-anchor=%22middle%22 fill=%22%2300FF00%22>📻</text></svg>">
    
    <!-- ========== STYLES ========== -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/winamp.css">
    
    <!-- ========== META TAGS ========== -->
    <meta name="description" content="Bro-Radio">
    <meta name="keywords" content="bro-radio, radio, music, online radio, web radio">
    <meta name="author" content="Vadim">
    <!-- Мета теги для мобильных устройств -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bro-Radio">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-main">BRO-RADIO </span>
                </h1>
            </div>
        </header>
        
        <!-- Winamp Player -->
        <div id="winamp-player">
            <!-- Winamp Header -->
            <div class="winamp-header">
                <div class="winamp-title">
                    <span class="winamp-text">WINAMP</span>
                    <span class="winamp-version">5.666</span>
                </div>
                <div class="winamp-controls">
                    <button class="winamp-btn minimize">─</button>
                    <button class="winamp-btn maximize">□</button>
                    <button class="winamp-btn close">×</button>
                </div>
            </div>
            
            <!-- Main Player -->
            <div class="winamp-main">
                <!-- Spectrum Display -->
                <div class="spectrum-display">
                    <div class="spectrum-bars"></div>
                    <div class="station-info" id="station-code-display">STATION: LOADING...</div>
                </div>
                
                <!-- Tabs for Stations -->
                <div class="tabs-container">
                    <button class="tab-btn active" id="all-tab">📡ВСЕ СТАНЦИИ</button>
                    <button class="tab-btn" id="favorites-tab">🤍 ИЗБРАННОЕ</button>
                    <button class="tab-btn" id="history-tab">📜ИСТОРИЯ</button>
                </div>
                
                <!-- Search Box -->
                <div class="search-box">
                    <div class="search-icon">🔍</div>
                    <input type="text" id="station-search" placeholder="Поиск станции..." autocomplete="off">
                    <div class="search-results" id="search-results"></div>
                </div>
                
                <!-- Station List Window -->
                <div class="station-window">
                    <div class="window-header">
                        <span>📻 СПИСОК СТАНЦИЙ</span>
                        <span class="station-count" id="station-count">0/0</span>
                    </div>
                    <div class="station-list" id="station-list">
                        <!-- Stations will be loaded here -->
                    </div>
                </div>
                
                <!-- Player Controls -->
                <div class="player-controls">
                    <div class="control-row">
                        <button class="ctrl-btn play" id="play-btn" title="Play">▶</button>
                        <button class="ctrl-btn pause" id="pause-btn" title="Pause">⏸</button>
                        <button class="ctrl-btn stop" id="stop-btn" title="Stop">⏹</button>
                        <button class="ctrl-btn prev" id="prev-btn" title="Previous">⏮</button>
                        <button class="ctrl-btn next" id="next-btn" title="Next">⏭</button>
                        <button class="ctrl-btn favorite" id="favorite-btn" title="Добавить в избранное">❤</button>
                    </div>
                    <div class="volume-control">
                        <span class="vol-label">VOL</span>
                        <input type="range" id="volume-slider" min="0" max="100" value="80" class="vol-slider">
                        <span id="volume-value">80%</span>
                    </div>
                </div>
                
                <!-- Status Bar -->
                <div class="status-bar">
                    <span id="status-text">Выберите станцию для воспроизведения</span>
                    <span class="bitrate" id="bitrate-display">--- kbps</span>
                </div>
            </div>
        </div>
        
        <!-- Quick Help -->
        <div class="quick-help">
            <p><kbd>Пробел</kbd> Play/Pause • <kbd>← →</kbd> Переключение • <kbd>+/-</kbd> Громкость</p>
        </div>
        
        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <div class="footer-info">
                    <span class="footer-version">v2.2</span>
                    <span class="footer-separator">•</span>
                    <span class="footer-separator">2026</span>
                    <span class="footer-separator">•</span>
                    <span class="footer-author">© Vadim</span>
                </div>
                
                <div class="footer-contact">
                    <span class="footer-email">seevaa57@gmail.com</span>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- Hidden Audio Player - с атрибутами для мобильных -->
    <audio id="audio-player" preload="none" playsinline webkit-playsinline x-webkit-airplay="allow"></audio>

    <!-- JavaScript -->
    <script src="scripts/stations.js"></script>
    <script src="scripts/utils.js" defer></script>
    <script src="scripts/app.js" defer></script>
    
    <!-- Простое решение для фонового воспроизведения -->
    <script>
    // Минимальный код для фонового воспроизведения
    document.addEventListener('DOMContentLoaded', function() {
        const audio = document.getElementById('audio-player');
        
        // Восстанавливаем воспроизведение если браузер остановил
        audio.addEventListener('pause', function() {
            if (document.hidden && this.src && !this.paused) {
                setTimeout(() => {
                    if (document.hidden && this.paused) {
                        this.play().catch(() => {});
                    }
                }, 100);
            }
        });
        
        // Для iOS - возобновляем при касании
        document.addEventListener('touchstart', function() {
            if (audio.paused && audio.src) {
                audio.play().catch(() => {});
            }
        });
        
        // Активируем аудио контекст при первом касании
        document.addEventListener('touchstart', function activateAudio() {
            if (window.AudioContext) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
            }
            document.removeEventListener('touchstart', activateAudio);
        }, { once: true });
    });
    </script>
</body>
</html>
